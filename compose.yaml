services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sistema_chamados
      POSTGRES_USER: chamados_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - chamados_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chamados_app -d sistema_chamados
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/sistema_chamados
      DB_USERNAME: chamados_app
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  chamados_data:
